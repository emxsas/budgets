<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Presupuesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <div class="shell">

            <!-- ===================== DESKTOP SIDEBAR ===================== -->
            <aside class="nav-side">
                <div class="brand">
                    <div class="brand-mark">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10h20"/><circle cx="17" cy="14" r="1.4" fill="currentColor" stroke="none"/></svg>
                    </div>
                    <div class="brand-name">Presupuesto</div>
                </div>
                <button class="btn-add-side" data-add="open">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Añadir
                </button>
                <button class="side-btn" data-tab="resumen"></button>
                <button class="side-btn" data-tab="movimientos"></button>
                <button class="side-btn" data-tab="presupuestos"></button>
                <button class="side-btn" data-tab="deuda"></button>
                <button class="side-btn" data-tab="ejecucion"></button>
                <button class="side-btn" data-tab="ajustes"></button>
                <div class="side-user">
                    <div class="side-avatar">JM</div>
                    <div>
                        <div style="font-size:12.5px;font-weight:600">Mi presupuesto</div>
                        <div class="topbar-month" style="letter-spacing:0" data-month></div>
                    </div>
                </div>
            </aside>

            <!-- ===================== MAIN ===================== -->
            <main class="main">
                <div class="content">
                    <div class="topbar">
                        <div>
                            <div class="topbar-month" data-month></div>
                            <div class="topbar-title" id="screen-title">Resumen</div>
                        </div>
                        <button class="icon-btn topbar-gear" data-tab="ajustes" aria-label="Ajustes">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                        </button>
                    </div>

                    <section id="resumen-section" class="tab-section"></section>
                    <section id="movimientos-section" class="tab-section" hidden></section>
                    <section id="presupuestos-section" class="tab-section" hidden></section>
                    <section id="deuda-section" class="tab-section" hidden></section>
                    <section id="ejecucion-section" class="tab-section" hidden></section>
                    <section id="ajustes-section" class="tab-section" hidden></section>
                </div>
            </main>
        </div>

        <!-- ===================== MOBILE BOTTOM NAV ===================== -->
        <nav class="nav-bottom">
            <div class="nav-bottom-inner">
                <button class="tab-btn" data-tab="resumen">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>Resumen
                </button>
                <button class="tab-btn" data-tab="movimientos">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M7 7 4 4M7 7 4 10"/><path d="M17 17H4M17 17l3 3M17 17l3-3"/></svg>Mov.
                </button>
                <button class="fab" data-add="open" aria-label="Añadir">
                    <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
                </button>
                <button class="tab-btn" data-tab="deuda">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Deuda
                </button>
                <button class="tab-btn" data-tab="ejecucion">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11M9 12h11M9 19h11M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>Ejec.
                </button>
            </div>
        </nav>

        <!-- add / edit sheet mounts here -->
        <div id="sheet-root"></div>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
